<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Netum C750 — Configurator</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318181b'/%3E%3Cg fill='%23fafafa'%3E%3Crect x='7' y='8' width='2' height='16'/%3E%3Crect x='11' y='8' width='1.5' height='16'/%3E%3Crect x='14' y='8' width='3' height='16'/%3E%3Crect x='19' y='8' width='1.5' height='16'/%3E%3Crect x='22' y='8' width='2.5' height='16'/%3E%3Crect x='26' y='8' width='1' height='16'/%3E%3C/g%3E%3C/svg%3E">
  <style>
:root {
  --background: 240 5% 96%;
  --foreground: 240 10% 3.9%;
  --card: 0 0% 100%;
  --card-foreground: 240 10% 3.9%;
  --muted: 240 5% 93%;
  --muted-foreground: 240 4% 40%;
  --border: 240 6% 86%;
  --input: 240 6% 86%;
  --primary: 240 6% 10%;
  --primary-foreground: 0 0% 98%;
  --accent: 240 5% 92%;
  --ring: 240 5.9% 10%;
  --destructive: 0 72% 51%;
  --destructive-foreground: 0 0% 98%;
  --sidebar: 240 6% 94%;
  --panel-bg: 240 8% 93%;
  --header-bg: 0 0% 100%;
  --option-bg: 240 6% 97%;
  --selected: 220 14% 88%;
  --selected-border: 220 12% 72%;
  --radius: 0.75rem;
  --panel: 360px;
  --sidebar-w: 240px;
  --header: 56px;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 1px 3px rgb(0 0 0 / 0.06);
}
.dark {
  --background: 240 10% 6%;
  --foreground: 0 0% 98%;
  --card: 240 8% 11%;
  --card-foreground: 0 0% 98%;
  --muted: 240 6% 16%;
  --muted-foreground: 240 5% 70%;
  --border: 240 5% 20%;
  --input: 240 5% 22%;
  --primary: 0 0% 98%;
  --primary-foreground: 240 5.9% 10%;
  --accent: 240 5% 18%;
  --ring: 240 5% 84%;
  --sidebar: 240 10% 8%;
  --panel-bg: 240 9% 8%;
  --header-bg: 240 10% 8%;
  --option-bg: 240 8% 14%;
  --selected: 220 12% 22%;
  --selected-border: 220 10% 38%;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
h1,h2,h3 { letter-spacing: -0.025em; font-weight: 600; margin: 0; }
.header {
  position: sticky; top: 0; z-index: 40; height: var(--header);
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px; border-bottom: 1px solid hsl(var(--border));
  background: hsl(var(--header-bg));
  box-shadow: var(--shadow);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 220px; }
.logo {
  width: 28px; height: 28px; border-radius: 8px;
  background: hsl(var(--primary)); color: hsl(var(--primary-foreground));
  display: grid; place-items: center; overflow: hidden; flex-shrink: 0;
}
.logo svg { display: block; width: 28px; height: 28px; }
.brand small { display: block; color: hsl(var(--muted-foreground)); font-size: 11px; font-weight: 400; }
.search {
  flex: 1; max-width: 420px; position: relative;
}
.search input {
  width: 100%; height: 36px; padding: 0 36px 0 34px; border-radius: 8px;
  border: 1px solid hsl(var(--input)); background: hsl(var(--muted));
  outline: none;
}
.search input:focus { box-shadow: 0 0 0 3px hsl(var(--ring) / 0.15); border-color: hsl(var(--ring)); background: hsl(var(--card)); }
.search > svg { position: absolute; left: 10px; top: 9px; color: hsl(var(--muted-foreground)); pointer-events: none; }
.search-clear {
  position: absolute; right: 4px; top: 4px; width: 28px; height: 28px; padding: 0;
  border: 0; border-radius: 6px; background: transparent; cursor: pointer;
  color: hsl(var(--muted-foreground)); display: none; align-items: center; justify-content: center;
}
.search-clear:hover { background: hsl(var(--accent)); color: hsl(var(--foreground)); }
.search.has-query .search-clear { display: inline-flex; }
.header-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.btn {
  height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid hsl(var(--border));
  background: hsl(var(--card)); cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  box-shadow: 0 1px 1px rgb(0 0 0 / 0.03);
}
.btn:hover { background: hsl(var(--accent)); }
.btn-primary { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); border-color: transparent; box-shadow: none; }
.btn-primary:hover { opacity: 0.92; background: hsl(var(--primary)); }
.btn-ghost { border-color: transparent; background: transparent; box-shadow: none; }
.btn-danger { color: hsl(var(--destructive)); }
.layout { display: grid; grid-template-columns: var(--sidebar-w) 1fr var(--panel); min-height: calc(100vh - var(--header)); }
.sidebar {
  border-right: 1px solid hsl(var(--border)); padding: 12px; position: sticky; top: var(--header);
  height: calc(100vh - var(--header)); overflow: auto;
  background: hsl(var(--sidebar));
  display: flex; flex-direction: column; gap: 6px;
}
.nav-btn {
  width: 100%; text-align: left; padding: 8px 10px; border: 0; background: transparent;
  border-radius: 8px; cursor: pointer; color: hsl(var(--muted-foreground)); display: flex; justify-content: space-between;
}
.nav-btn:hover { background: hsl(var(--card) / 0.7); color: hsl(var(--foreground)); }
.nav-btn.active {
  background: hsl(var(--card)); color: hsl(var(--foreground));
  box-shadow: var(--shadow);
  font-weight: 600;
}
.main { padding: 24px 28px 80px; min-width: 0; }
.page-title { font-size: 24px; margin-bottom: 4px; }
.lede { color: hsl(var(--muted-foreground)); margin-bottom: 20px; }
.card {
  background: hsl(var(--card)); border: 1px solid hsl(var(--border));
  border-radius: var(--radius); padding: 16px; margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.card h3 { font-size: 15px; margin-bottom: 4px; }
.note { color: hsl(var(--muted-foreground)); font-size: 12.5px; margin: 0 0 12px; }
.options {
  display: grid; gap: 6px; max-height: 380px; overflow: auto; margin-top: 10px;
  padding: 6px; border-radius: 10px;
  background: hsl(var(--muted));
  border: 1px solid hsl(var(--border) / 0.7);
}
.opt {
  display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
  padding: 8px 10px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; text-align: left;
  background: transparent; width: 100%;
}
.opt:hover { background: hsl(var(--card) / 0.7); }
.opt.active {
  background: hsl(240 8% 13%);
  color: hsl(0 0% 98%);
  border-color: transparent;
  font-weight: 500;
}
.opt.active .badge {
  background: transparent;
  border-color: hsl(0 0% 100% / 0.2);
  color: hsl(0 0% 82%);
}
.opt.active .badge.def {
  background: hsl(0 0% 98%);
  color: hsl(240 8% 13%);
  border-color: transparent;
}
.opt.active .badge.ret {
  background: hsl(214 30% 24%);
  border-color: transparent;
  color: hsl(210 40% 90%);
}
.opt.active .badge.dang {
  background: hsl(0 50% 22%);
  border-color: transparent;
  color: hsl(0 90% 90%);
}
.opt .note {
  color: hsl(240 5% 32%);
  font-weight: 400;
}
.opt.active .note {
  color: hsl(240 6% 78%);
}
.dark .opt.active {
  background: hsl(0 0% 96%);
  color: hsl(240 8% 12%);
}
.dark .opt.active .badge {
  border-color: hsl(240 6% 12% / 0.18);
  color: hsl(240 5% 35%);
}
.dark .opt.active .badge.def {
  background: hsl(240 8% 12%);
  color: hsl(0 0% 98%);
}
.opt .meta { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.badge {
  font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase;
  padding: 2px 6px; border-radius: 999px; border: 1px solid hsl(var(--border));
  color: hsl(var(--muted-foreground)); background: hsl(var(--card));
}
.badge.def { background: hsl(var(--foreground)); color: hsl(var(--background)); border-color: transparent; }
.badge.ret { border-color: hsl(215 20% 65%); color: hsl(215 25% 40%); background: hsl(214 32% 96%); }
.badge.dang { color: hsl(var(--destructive)); border-color: hsl(var(--destructive) / 0.4); background: hsl(0 86% 97%); }
.dark .badge.ret { background: hsl(215 25% 18%); color: hsl(214 40% 78%); }
.dark .badge.dang { background: hsl(0 40% 16%); }
.barcode-stage {
  margin-top: 12px; background: #fff; color: #111; border-radius: 10px; padding: 16px 16px 12px;
  display: grid; place-items: center; min-height: 140px; border: 1px dashed #d4d4d8;
  box-shadow: inset 0 0 0 6px #fafafa;
}
.barcode-stage svg, .barcode-stage img { max-width: 100%; height: auto; }
.human { margin-top: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px; color: #3f3f46; word-break: break-all; text-align: center; }
.scan-tip { font-size: 11px; color: #71717a; margin-top: 6px; text-align: center; }
.panel {
  border-left: 1px solid hsl(var(--border)); padding: 14px; position: sticky; top: var(--header);
  height: calc(100vh - var(--header)); overflow: auto; background: hsl(var(--panel-bg));
}
.panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: hsl(var(--muted-foreground)); margin-bottom: 10px; }
.capture {
  width: 100%; min-height: 72px; padding: 10px 12px; border-radius: 10px;
  border: 1px solid hsl(var(--input)); background: hsl(var(--card));
  outline: none; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  box-shadow: var(--shadow);
}
.capture:focus { box-shadow: 0 0 0 3px hsl(var(--ring) / 0.18); border-color: hsl(var(--ring)); }
.capture.armed { box-shadow: 0 0 0 3px hsl(142 70% 45% / 0.25); border-color: hsl(142 55% 36%); }
.result-box {
  margin-top: 10px; padding: 10px; border-radius: 10px; background: hsl(var(--card));
  border: 1px solid hsl(var(--border));
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px;
  word-break: break-all; min-height: 44px; user-select: text;
}
.result-box.flash { animation: flash 0.6s ease; }
@keyframes flash { from { background: hsl(142 70% 45% / 0.25); } }
.kvs { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.history { list-style: none; padding: 0; margin: 8px 0 0; }
.history li {
  padding: 8px; border-radius: 8px; border: 1px solid hsl(var(--border)); margin-bottom: 6px;
  background: hsl(var(--card));
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
  cursor: pointer;
}
.history li:hover { border-color: hsl(var(--ring) / 0.35); }
.tools { display: grid; gap: 10px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; color: hsl(var(--muted-foreground)); }
.field input, .field select, .field textarea {
  height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid hsl(var(--input));
  background: hsl(var(--muted));
}
.field input:focus, .field select:focus, .field textarea:focus { background: hsl(var(--card)); outline: none; box-shadow: 0 0 0 3px hsl(var(--ring) / 0.12); }
.field textarea { height: 72px; padding: 8px 10px; resize: vertical; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.overlay {
  position: fixed; inset: 0; background: rgb(0 0 0 / 0.55); display: none; place-items: center; z-index: 50; padding: 24px;
}
.overlay.show { display: grid; }
.overlay .sheet { background: #fff; color: #111; padding: 28px; border-radius: 16px; max-width: 90vw; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: hsl(var(--muted-foreground)); }
.hidden { display: none !important; }
.empty { color: hsl(var(--muted-foreground)); font-size: 13px; padding: 8px 0; }
@media (max-width: 1100px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar, .panel { position: static; height: auto; border: 0; }
  .sidebar { display: flex; flex-direction: row; gap: 6px; overflow: auto; border-bottom: 1px solid hsl(var(--border)); }
  .nav-btn { white-space: nowrap; width: auto; }
  .panel { border-top: 1px solid hsl(var(--border)); }
}
@media print {
  .header, .sidebar, .panel, .btn, .search { display: none !important; }
  .layout { display: block; }
  .barcode-stage { break-inside: avoid; }
}
</style>
</head>

  <header class="header">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="#fafafa">
          <rect x="7" y="8" width="2" height="16"/>
          <rect x="11" y="8" width="1.5" height="16"/>
          <rect x="14" y="8" width="3" height="16"/>
          <rect x="19" y="8" width="1.5" height="16"/>
          <rect x="22" y="8" width="2.5" height="16"/>
          <rect x="26" y="8" width="1" height="16"/>
        </svg>
      </div>
      <div>
        <strong>Netum C750</strong>
        <small id="subtitle">Configurator · manual v1.0.0</small>
      </div>
    </div>
    <div class="search" id="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
      <input id="q" placeholder="Search a setting, symbology, or command…" autocomplete="off">
      <button class="search-clear" id="q-clear" type="button" title="Clear search" aria-label="Clear search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="header-actions">
      <button class="btn" id="lang-btn" type="button" title="Français">FR</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="nav"></aside>
    <main class="main" id="main"></main>
    <aside class="panel">
      <h2 id="reception-title">Keyboard input</h2>
      <label class="switch" id="arm-label"><input type="checkbox" id="arm" checked> Capture on</label>
      <p class="note" id="capture-help">This field stays focused, even after clicking a button. Uncheck “Capture on” only to type in search or tools.</p>
      <textarea id="capture" class="capture armed" placeholder="Ready — scan a barcode…" autocomplete="off" spellcheck="false"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="btn btn-primary" id="select-result" type="button">Select all</button>
        <button class="btn" id="copy-result" type="button">Copy</button>
      </div>
      <div id="kvs" class="kvs"></div>
      <div class="result-box" id="result-vis">Waiting</div>
      <div class="row" style="margin-top:10px; justify-content:space-between; align-items:center">
        <h2 id="history-title" style="margin:0">History</h2>
        <button class="btn btn-ghost" id="clear-hist" type="button">Clear</button>
      </div>
      <ul class="history" id="hist"></ul>
    </aside>
  </div>
  <div class="overlay" id="overlay"></div>

function bestCharset(bytes) {

      if (bar) parts.push(`<rect x="${x}" y="0" width="${w}" height="${height}" fill="#000"/>`);
      x += w; bar = !bar;
    }
  }

let state = {
  cat: "start",
  selected: {},
  query: "",
  history: JSON.parse(localStorage.getItem("c750-history") || "[]"),
  armed: true,
  lang: localStorage.getItem("c750-lang") === "fr" ? "fr" : "en",
};

function t(key, vars) {
  const dict = I18N[state.lang] || I18N.fr;
  let s = dict[key] || I18N.fr[key] || key;
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.replaceAll("{" + k + "}", v);
  return s;
}
function tr(s) {
  if (!s || state.lang === "fr") return s;
  return TX[s] || s;
}
function updateChrome() {
  document.documentElement.lang = state.lang;
  const q = document.getElementById("q");
  q.placeholder = t("search_ph");
  const clr = document.getElementById("q-clear");
  clr.title = t("search_clear");
  clr.setAttribute("aria-label", t("search_clear"));
  document.getElementById("lang-btn").textContent = state.lang === "fr" ? "EN" : "FR";
  document.getElementById("lang-btn").title = t("lang_title");
  document.getElementById("reception-title").textContent = t("reception");
  document.getElementById("arm-label").lastChild.textContent = " " + t("capture_on");
  document.getElementById("capture-help").textContent = t("capture_help");
  document.getElementById("capture").placeholder = t("capture_ph");
  document.getElementById("select-result").textContent = t("select_all");
  document.getElementById("copy-result").textContent = t("copy");
  const vis = document.getElementById("result-vis");
  if (!vis.textContent || vis.textContent === I18N.fr.waiting || vis.textContent === I18N.en.waiting) vis.textContent = t("waiting");
  document.getElementById("history-title").textContent = t("history");
  document.getElementById("clear-hist").textContent = t("clear");
  document.getElementById("subtitle").textContent = t("subtitle");
  document.title = t("tab_title");
}


function saveHist() {
  localStorage.setItem("c750-history", JSON.stringify(state.history.slice(0, 50)));
}

function renderNav() {
  const el = document.getElementById("nav");
  el.innerHTML = CATALOG.map(c => `<button class="nav-btn ${state.cat===c.id?"active":""}" data-cat="${c.id}">${escapeHtml(tr(c.title))}</button>`).join("")
    + `<button class="nav-btn ${state.cat==="tools"?"active":""}" data-cat="tools">${escapeHtml(t("tools"))}</button>`
    + `<button class="nav-btn ${state.cat==="all"?"active":""}" data-cat="all">${escapeHtml(t("all_codes"))}</button>`;
  el.querySelectorAll("button").forEach(b => b.onclick = () => { state.cat = b.dataset.cat; render(); });
}

function renderBarcode(code, qr) {
  const useQr = qr || code.length > 40 || /[\r\n\t]/.test(code);
  try {
    if (useQr) return svgQR(code, 200);
    return svg128(code);
  } catch (e) {
    try { return svgQR(code, 200); } catch { return `<div class="empty">${escapeHtml(e.message)}</div>`; }
  }
}

function selectItem(gid, item) {
  state.selected[gid] = item.code;
  render();
}

function itemButton(g, it) {
  const active = state.selected[g.id] === it.code;
  const badges = [
    it.default ? `<span class="badge def">${t("badge_def")}</span>` : "",
    it.returns ? `<span class="badge ret">${t("badge_ret")}</span>` : "",
    it.danger ? `<span class="badge dang">${t("badge_dang")}</span>` : "",
    it.toggle ? `<span class="badge">${t("badge_toggle")}</span>` : "",
    it.qr ? `<span class="badge">QR</span>` : "",
  ].join("");
  return `<button class="opt ${active?"active":""}" data-gid="${g.id}" data-code="${encodeURIComponent(it.code)}">
    <span>${escapeHtml(tr(it.label))}${it.note && g.kind==="actions" ? `<div class="note" style="margin:4px 0 0">${escapeHtml(tr(it.note))}</div>`:""}</span>
    <span class="meta">${badges}</span>
  </button>`;
}

function groupCard(g) {
  if (!state.selected[g.id]) {
    const def = g.items.find(i => i.default) || g.items[0];
    if (def) state.selected[g.id] = def.code;
  }
  const current = g.items.find(i => i.code === state.selected[g.id]) || g.items[0];
  return `<section class="card" id="g-${g.id}">
    <h3>${escapeHtml(tr(g.title))}</h3>
    ${g.note ? `<p class="note">${escapeHtml(tr(g.note))}</p>` : ""}
    <div class="barcode-stage" id="stage-${g.id}" data-code="${encodeURIComponent(current.code)}" data-qr="${current.qr?1:0}">
      ${renderBarcode(current.code, current.qr)}
      <div class="human">${escapeHtml(visibleCode(current.code))}</div>
      <div class="scan-tip">${escapeHtml(t("scan_tip"))}</div>
    </div>
    <div class="options">${g.items.map(it => itemButton(g, it)).join("")}</div>
  </section>`;
}

function matchesQuery(it, extra="") {
  if (!state.query) return true;
  const q = state.query.toLowerCase();
  return (it.label+" "+tr(it.label)+" "+it.code+" "+(it.note||"")+" "+tr(it.note||"")+" "+extra+" "+tr(extra)).toLowerCase().includes(q);
}
function filterCat(cat) {
  const groups = cat.groups.map(g => ({
    ...g,
    items: g.items.filter(it => matchesQuery(it, cat.title+" "+g.title))
  })).filter(g => g.items.length);
  return { ...cat, groups };
}

function renderTools() {
  return `<h1 class="page-title">${escapeHtml(t("tools"))}</h1>
  <p class="lede">${escapeHtml(t("tools_lede"))}</p>
  <section class="card">
    <h3>${escapeHtml(t("tools_affix"))}</h3>
    <p class="note">${escapeHtml(t("tools_affix_note"))}</p>
    <div class="tools">
      <div class="row">
        <div class="field"><label>${escapeHtml(t("type"))}</label>
          <select id="edit-kind"><option value="2">${escapeHtml(t("prefix"))}</option><option value="1">${escapeHtml(t("suffix"))}</option></select>
        </div>
      </div>
      <div class="field"><label>${escapeHtml(t("text_hex"))}</label><input id="edit-text" placeholder="${escapeHtml(t("text_ph"))}"></div>
      <button class="btn btn-primary" id="btn-edit">${escapeHtml(t("generate"))}</button>
      <div id="edit-out"></div>
    </div>
  </section>
  <section class="card">
    <h3>${escapeHtml(t("hide_title"))}</h3>
    <div class="tools">
      <div class="row">
        <div class="field"><label>${escapeHtml(t("zone"))}</label>
          <select id="hide-kind">
            <option value="5">${escapeHtml(t("head"))}</option>
            <option value="4">${escapeHtml(t("middle"))}</option>
            <option value="3">${escapeHtml(t("tail"))}</option>
          </select>
        </div>
        <div class="field"><label>${escapeHtml(t("start_hex"))}</label><input id="hide-start" value="00" maxlength="2"></div>
        <div class="field"><label>${escapeHtml(t("len_hex"))}</label><input id="hide-len" value="04" maxlength="2"></div>
      </div>
      <button class="btn btn-primary" id="btn-hide">${escapeHtml(t("generate"))}</button>
      <div id="hide-out"></div>
    </div>
  </section>
  <section class="card">
    <h3>${escapeHtml(t("replace_title"))}</h3>
    <p class="note">${escapeHtml(t("replace_note"))}</p>
    <div class="tools">
      <div class="field"><label>${escapeHtml(t("find"))}</label><input id="rep-from" placeholder="\\x1D ou NT"></div>
      <div class="field"><label>${escapeHtml(t("replace_with"))}</label><input id="rep-to" placeholder="GS"></div>
      <button class="btn btn-primary" id="btn-rep">${escapeHtml(t("generate"))}</button>
      <div id="rep-out"></div>
    </div>
  </section>
  <section class="card">
    <h3>${escapeHtml(t("bt_title"))}</h3>
    <p class="note">${escapeHtml(t("bt_note"))}</p>
    <div class="tools">
      <div class="field"><label>${escapeHtml(t("bt_name"))}</label><input id="bt-name" placeholder="C750-Atelier"></div>
      <button class="btn btn-primary" id="btn-bt">${escapeHtml(t("bt_gen"))}</button>
      <div id="bt-out"></div>
    </div>
  </section>
  <section class="card">
    <h3>${escapeHtml(t("len_title"))}</h3>
    <p class="note">${escapeHtml(t("len_note"))}</p>
    <div class="tools">
      <div class="row">
        <div class="field"><label>${escapeHtml(t("min"))}</label><input id="len-min" type="number" min="1" max="99" value="4"></div>
        <div class="field"><label>${escapeHtml(t("max"))}</label><input id="len-max" type="number" min="1" max="99" value="8"></div>
      </div>
      <div id="len-out" class="row"></div>
    </div>
  </section>`;
}

function expandEscapes(s) {
  return s.replace(/\\x([0-9A-Fa-f]{2})/g, (_, h) => String.fromCharCode(parseInt(h,16)))
          .replace(/\\n/g, "\n").replace(/\\r/g, "\r").replace(/\\t/g, "\t");
}
function padHexLen(n) { return n.toString(16).toUpperCase().padStart(2,"0"); }
function showGenerated(target, command, qr=false) {
  document.getElementById(target).innerHTML = `<div class="barcode-stage">${renderBarcode(command, qr)}<div class="human">${escapeHtml(visibleCode(command))}</div></div>`;
}
function wireTools() {
  const on = (id, fn) => document.getElementById(id)?.addEventListener("click", fn);
  on("btn-edit", () => {
    const kind = document.getElementById("edit-kind").value;
    const raw = expandEscapes(document.getElementById("edit-text").value);
    if (!raw) return;
    const cmd = `$DATA#${kind}0${padHexLen(raw.length)}${raw}#`;
    showGenerated("edit-out", cmd, cmd.length > 32);
  });
  on("btn-hide", () => {
    const kind = document.getElementById("hide-kind").value;
    const start = document.getElementById("hide-start").value.toUpperCase().padStart(2,"0");
    const len = document.getElementById("hide-len").value.toUpperCase().padStart(2,"0");
    const cmd = kind === "4" ? `$DATA#400${start}${len}#` : `$DATA#${kind}0${len}#`;
    showGenerated("hide-out", cmd, true);
  });
  on("btn-rep", () => {
    const from = expandEscapes(document.getElementById("rep-from").value);
    const to = expandEscapes(document.getElementById("rep-to").value);
    if (!from) return;
    const cmd = `$DATA#70${padHexLen(from.length)}${from}${padHexLen(to.length)}${to}#`;
    showGenerated("rep-out", cmd, true);
  });
  on("btn-bt", () => {
    const name = document.getElementById("bt-name").value.trim();
    if (!name) return;
    showGenerated("bt-out", "AT+NAME=" + name, true);
  });
  const paintLen = () => {
    const a = Math.max(0, Math.min(99, Number(document.getElementById("len-min").value)||0));
    const b = Math.max(0, Math.min(99, Number(document.getElementById("len-max").value)||0));
    const digits = [Math.floor(a/10), a%10, Math.floor(b/10), b%10].map(String);
    document.getElementById("len-out").innerHTML = digits.map((d,i) =>
      `<div class="barcode-stage" style="padding:8px">${renderBarcode("A"+d)}<div class="human">${i+1}. ${d}</div></div>`
    ).join("");
  };
  document.getElementById("len-min")?.addEventListener("input", paintLen);
  document.getElementById("len-max")?.addEventListener("input", paintLen);
  paintLen();
}

function renderAll() {
  const q = state.query.toLowerCase();
  const rows = ALL_CODES.filter(e => !q || (e.label+" "+e.code+" "+e.cat+" "+(CODE_FR[e.code]||"")+" "+tr(e.cat)).toLowerCase().includes(q));
  return `<h1 class="page-title">${escapeHtml(t("all_codes"))}</h1>
    <p class="lede">${escapeHtml(t("all_lede", {n: String(rows.length)}))}</p>
    <div id="all-stage" class="barcode-stage hidden"></div>
    <div class="card" style="padding:0; overflow:auto">
      <table style="width:100%; border-collapse:collapse; font-size:12.5px">
        <thead><tr style="text-align:left; color:hsl(var(--muted-foreground))">
          <th style="padding:8px 10px">${escapeHtml(t("col_page"))}</th><th>${escapeHtml(t("col_cat"))}</th><th>${escapeHtml(t("col_label"))}</th><th>${escapeHtml(t("col_cmd"))}</th>
        </tr></thead>
        <tbody>
          ${rows.map(e => `<tr class="all-row" data-code="${encodeURIComponent(e.code)}" data-qr="${e.qr?1:0}" style="border-top:1px solid hsl(var(--border)); cursor:pointer">
            <td style="padding:6px 10px; color:hsl(var(--muted-foreground))">${e.page}</td>
            <td>${escapeHtml(tr(e.cat))}</td>
            <td>${escapeHtml(state.lang === "fr" ? (CODE_FR[e.code] || tr(e.label) || e.label) : e.label)}</td>
            <td style="font-family:ui-monospace,monospace">${escapeHtml(visibleCode(e.code))}</td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>`;
}

function bindCards(rootGroups) {
  const main = document.getElementById("main");
  main.querySelectorAll(".opt").forEach(btn => btn.onclick = () => {
    const code = decodeURIComponent(btn.dataset.code);
    const gid = btn.dataset.gid;
    const g = rootGroups.find(x => x.id === gid);
    const it = g.items.find(i => i.code === code);
    selectItem(gid, it);
  });
  main.querySelectorAll(".barcode-stage").forEach(st => st.onclick = () => enlarge(st));
}
function renderMain() {
  const main = document.getElementById("main");
  if (state.query && state.cat !== "all") {
    const groups = CATALOG.flatMap(c => filterCat(c).groups.map(g => ({...g, id: c.id+"-"+g.id, title: c.title+" · "+g.title})));
    main.innerHTML = `<h1 class="page-title">${escapeHtml(t("search"))}</h1>
      <p class="lede">${escapeHtml(t("search_lede", {n: String(groups.length), q: state.query}))}</p>
      ${groups.map(groupCard).join("") || `<p class="empty">${escapeHtml(t("no_results"))}</p>`}`;
    bindCards(groups);
    return;
  }
  if (state.cat === "tools") { main.innerHTML = renderTools(); wireTools(); return; }
  if (state.cat === "all") {
    main.innerHTML = renderAll();
    main.querySelectorAll(".all-row").forEach(row => row.onclick = () => {
      const code = decodeURIComponent(row.dataset.code);
      const stage = document.getElementById("all-stage");
      stage.classList.remove("hidden");
      stage.innerHTML = renderBarcode(code, row.dataset.qr==="1") + `<div class="human">${escapeHtml(visibleCode(code))}</div>`;
      stage.scrollIntoView({behavior:"smooth", block:"nearest"});
    });
    return;
  }
  const cat = filterCat(CATALOG.find(c => c.id === state.cat) || CATALOG[0]);
  main.innerHTML = `<h1 class="page-title">${escapeHtml(tr(cat.title))}</h1>
    <p class="lede">${escapeHtml(tr(cat.hint || ""))}</p>
    ${cat.groups.map(groupCard).join("") || `<p class="empty">${escapeHtml(t("no_results_short"))}</p>`}`;
  bindCards(cat.groups);
}

function enlarge(stage) {
  const ov = document.getElementById("overlay");
  ov.innerHTML = `<div class="sheet">${stage.innerHTML}</div>`;
  ov.classList.add("show");
}

function renderHistory() {
  const ul = document.getElementById("hist");
  if (!state.history.length) { ul.innerHTML = `<li class="empty" style="border:0">${escapeHtml(t("no_history"))}</li>`; return; }
  ul.innerHTML = state.history.map((h,i) => `<li data-i="${i}">${escapeHtml(visibleCode(h.v))}<div class="note" style="margin:4px 0 0">${new Date(h.t).toLocaleTimeString()} · ${escapeHtml(analyze(h.v).join(" · "))}</div></li>`).join("");
  ul.querySelectorAll("li[data-i]").forEach(li => li.onclick = () => {
    const v = state.history[+li.dataset.i].v;
    showResult(v, false);
    const cap = document.getElementById("capture");
    cap.value = v; cap.focus(); cap.select();
  });
}

function keepCapture() {
  if (!state.armed) return;
  const input = document.getElementById("capture");
  if (!input) return;
  const a = document.activeElement;
  if (a && a !== input && a.closest && a.closest("input, textarea, select") && a.id !== "capture") return;
  if (a !== input) input.focus({ preventScroll: true });
}

function isTypingField(el) {
  if (!el || el.id === "capture") return false;
  return !!el.closest?.("input, textarea, select");
}

function showResult(value, store) {
  if (store) {
    state.history.unshift({ v: value, t: Date.now() });
    state.history = state.history.slice(0, 50);
    saveHist();
    renderHistory();
  }
  const vis = document.getElementById("result-vis");
  vis.classList.remove("hidden");
  vis.textContent = value ? visibleCode(value) : t("waiting");
  vis.classList.remove("flash"); void vis.offsetWidth; vis.classList.add("flash");
  document.getElementById("kvs").innerHTML = analyze(value).map(t => `<span class="badge">${t}</span>`).join("")
    + (value ? `<span class="badge">hex ${hexdump(value)}</span>` : "");
}

function setupCapture() {
  const input = document.getElementById("capture");
  let idle = null;
  let committed = false;
  let lastValue = "";
  let lastAt = 0;
  const IDLE = 120;
  function commit() {
    clearTimeout(idle);
    idle = null;
    const v = input.value.replace(/(?:\r\n|\r|\n)+$/g, "");
    if (!v) return;
    const now = Date.now();
    if (v === lastValue && now - lastAt < 700) {
      committed = true;
      input.value = "";
      input.focus();
      return;
    }
    lastValue = v;
    lastAt = now;
    committed = true;
    showResult(v, true);
    input.value = "";
    input.focus();
  }
  function beginNewScan(firstChar) {
    committed = false;
    input.value = firstChar || "";
  }
  function arm() {
    keepCapture();
    input.classList.toggle("armed", state.armed);
  }
  input.addEventListener("keydown", (e) => {
    if (!state.armed) return;
    if (e.key === "Enter" || e.key === "Tab") {
      e.preventDefault();
      commit();
      return;
    }
    if (committed && e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
      beginNewScan();
    }
  });
  input.addEventListener("input", () => {
    if (!state.armed) return;
    if (committed) {
      const last = input.value.slice(-1);
      beginNewScan(last);
    }
    clearTimeout(idle);
    idle = setTimeout(commit, IDLE);
  });
  document.getElementById("arm").addEventListener("change", (e) => {
    state.armed = e.target.checked;
    input.classList.toggle("armed", state.armed);
    if (state.armed) arm();
  });
  document.getElementById("copy-result").onclick = async () => {
    const v = lastValue || input.value;
    try { await navigator.clipboard.writeText(v); } catch {
      input.select(); document.execCommand("copy");
    }
  };
  document.getElementById("clear-hist").onclick = () => { state.history = []; saveHist(); renderHistory(); };
  document.getElementById("select-result").onclick = () => {
    const v = lastValue || "";
    if (!v) return;
    try { navigator.clipboard.writeText(v); } catch { /* ignore */ }
    keepCapture();
  };
  document.addEventListener("pointerdown", (e) => {
    if (!state.armed) return;
    if (isTypingField(e.target)) return;
    if (e.target.closest("button, .opt, a, .nav-btn, .barcode-stage, .all-row, .history li, label, .sheet")) {
      e.preventDefault();
    }
  }, true);
  document.addEventListener("click", () => {
    if (!state.armed) return;
    requestAnimationFrame(keepCapture);
  }, true);
  document.addEventListener("focusin", (e) => {
    if (!state.armed) return;
    if (e.target.id === "capture" || isTypingField(e.target)) return;
    keepCapture();
  });
  document.addEventListener("focusout", () => { setTimeout(keepCapture, 0); });
  window.addEventListener("focus", keepCapture);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) keepCapture(); });
  arm();
}

function render() {
  renderNav();
  renderMain();
  keepCapture();
}

document.getElementById("overlay").onclick = (e) => { if (e.target.id === "overlay") e.currentTarget.classList.remove("show"); };
document.getElementById("q").addEventListener("input", (e) => {
  state.query = e.target.value;
  document.getElementById("search-wrap").classList.toggle("has-query", !!state.query);
  render();
});
document.getElementById("q-clear").addEventListener("click", () => {
  const q = document.getElementById("q");
  q.value = "";
  state.query = "";
  document.getElementById("search-wrap").classList.remove("has-query");
  render();
  keepCapture();
});
document.getElementById("lang-btn").onclick = () => {
  state.lang = state.lang === "fr" ? "en" : "fr";
  localStorage.setItem("c750-lang", state.lang);
  updateChrome();
  render();
  renderHistory();
};
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
    e.preventDefault(); document.getElementById("q").focus();
  }
});
updateChrome();
render();
setupCapture();
renderHistory();
</script>
